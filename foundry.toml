[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned for reproducible bytecode + verification. Keep in sync with the
# exact pragma in src/ (0.8.33). evm_version is left at Foundry's default
# (prague), the correct compiler target for current mainnet.
solc = "0.8.33"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true

# CI profile (referenced by .github/workflows/test.yml). Heavier fuzzing
# and invariant exploration than the local default for stronger signal.
[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 512
depth = 256
fail_on_revert = true

[profile.production]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200

[profile.production.fuzz]
runs = 5000

[profile.production.invariant]
runs = 1000
depth = 256
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
